name: Clean images

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: clean-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  clean:
    name: Delete unused images
    if: ${{ github.repository == 'coollabsio/coolify' }}
    permissions:
      contents: read
    environment:
      name: cleanup
      deployment: false
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Delete the unused images
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CLEANUP_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
        run: scripts/clean-images.sh --delete 250

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        if: ${{ always() }}
        with:
          name: clean-images
          path: scripts/clean-images.tsv
          if-no-files-found: ignore
          retention-days: 30
